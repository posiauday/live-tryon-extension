<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Virtual Try-On Pro</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <p class="eyebrow">AI FASHION DEMO</p>
      <h1>Live Try-On Pro</h1>
      <p class="description">Opens the live try-on in its own window so you can drag clothing images onto the camera.</p>
      <button id="openTryOnBtn" class="primary-btn">Open Try-On</button>
      <p id="popupStatus" class="status" role="status"></p>
      <label class="setting"><input id="rememberChoice" type="checkbox" checked /> Remember my last garment</label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
